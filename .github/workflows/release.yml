name: Release and NuGet Pack

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Pro nahrání souborů (DLL a NUPKG) do GitHub Release
      id-token: write  # Pro OIDC token (NuGet Trusted Publishing)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore AvaloniaConstructGenerator/AvaloniaConstructGenerator.csproj

    - name: Build project
      run: dotnet build AvaloniaConstructGenerator/AvaloniaConstructGenerator.csproj --configuration Release --no-restore

    - name: Pack NuGet package
      run: dotnet pack AvaloniaConstructGenerator/AvaloniaConstructGenerator.csproj --configuration Release --no-restore -o out

    - name: Prepare DLL for Release
      # Najde zkompilovanou DLL knihovnu a zkopíruje ji do složky 'out'
      run: find . -name "*.dll" -path "*/bin/Release/netstandard2.0/*" -exec cp {} out/ \;

    - name: Upload Artifacts to GitHub Release
      # Podmínka: Spustí se pouze v případě, že pipeline vyvolal 'release'
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          out/*.nupkg
          out/*.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to NuGet via OIDC
      uses: NuGet/login@v1
      id: login
      with:
        user: Zdendaki

    - name: Push NuGet Package to NuGet.org
      run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
